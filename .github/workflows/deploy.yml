name: Publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate version and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH format, got '$RELEASE_TAG'." >&2
            exit 1
          fi
          if [[ ! -f readme.txt ]]; then
            echo "readme.txt is missing; it must carry the Stable tag and changelog for $RELEASE_TAG." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          HEADER_VERSION="$(awk '/^[[:space:]]*\* Version:/ { print $3; exit }' cloudflare-utils.php)"
          STABLE_TAG="$(awk '/^Stable tag:/ { print $3; exit }' readme.txt)"
          if [[ "$VERSION" != "$HEADER_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match the plugin header version '$HEADER_VERSION' in cloudflare-utils.php." >&2
            exit 1
          fi
          if [[ "$VERSION" != "$STABLE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match the Stable tag '$STABLE_TAG' in readme.txt." >&2
            exit 1
          fi
          awk -v version="$VERSION" '
            $0 == "== Changelog ==" { changelog = 1; next }
            changelog && $0 == "= " version " =" { notes = 1; next }
            notes && /^=/ { exit }
            notes { print }
          ' readme.txt > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '^\* ' "$RUNNER_TEMP/release-notes.md"; then
            echo "readme.txt has no changelog entries under '= $VERSION ='." >&2
            exit 1
          fi
      - name: Build installable plugin ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package/cloudflare-utils"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/package/cloudflare-utils/"
          cd "$RUNNER_TEMP/package"
          zip -qr "$RUNNER_TEMP/cloudflare-utils.zip" cloudflare-utils
          unzip -t "$RUNNER_TEMP/cloudflare-utils.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/cloudflare-utils.zip" \
            --verify-tag --title "Release $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
